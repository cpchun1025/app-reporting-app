[project]
name = "trading-reporting-backend"
version = "0.1.0"
description = "Trading reporting MVP backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "passlib>=1.7,<2",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.1,<6"]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]
pythonpath = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/backend"]
